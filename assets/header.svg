<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">caveeroo, security research</title>
  <desc id="description">Jaime Cavero Sánchez. Application security and reverse engineering, with source-level evidence at trust boundaries.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1110"/>
      <stop offset="1" stop-color="#111715"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".028"/>
    </pattern>
    <style>
      .sans { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; }
      .mono { font-family: "Liberation Mono", Consolas, monospace; }
      .brand { font-size: 15px; font-weight: 700; letter-spacing: 1.8px; }
      .name { font-size: 72px; font-weight: 700; letter-spacing: -2.6px; }
      .role { font-size: 22px; font-weight: 400; letter-spacing: -.2px; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; }
      .value { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#background)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect x="0" width="6" height="360" fill="#ff6559"/>

  <text x="70" y="69" fill="#c7d0cc" class="mono brand">CAVEEROO <tspan fill="#ff6559">/</tspan> SECURITY RESEARCH</text>
  <line x1="70" y1="94" x2="1130" y2="94" stroke="#3b4641"/>

  <text x="70" y="178" fill="#f5f7f6" class="sans name">Jaime Cavero Sánchez</text>
  <text x="73" y="221" fill="#aeb9b4" class="sans role">Application security <tspan fill="#ff6559">/</tspan> reverse engineering</text>

  <line x1="70" y1="266" x2="1130" y2="266" stroke="#3b4641"/>
  <line x1="424" y1="266" x2="424" y2="328" stroke="#3b4641"/>
  <line x1="778" y1="266" x2="778" y2="328" stroke="#3b4641"/>

  <text x="70" y="291" fill="#74b8f2" class="mono label">FOCUS</text>
  <text x="70" y="317" fill="#f5f7f6" class="sans value">Parsers, types, and file boundaries</text>

  <text x="450" y="291" fill="#63c89a" class="mono label">STANDARD</text>
  <text x="450" y="317" fill="#f5f7f6" class="sans value">Claims bounded by public evidence</text>

  <text x="804" y="291" fill="#ff9b93" class="mono label">LOCATION</text>
  <text x="804" y="317" fill="#f5f7f6" class="sans value">Madrid, Spain</text>
</svg>
